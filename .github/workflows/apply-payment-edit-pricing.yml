name: Apply payment edit pricing patch

on:
  push:
    branches:
      - feature/payment-pricing-cotizador
    paths:
      - scripts/patch-payment-edit.py

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/payment-pricing-cotizador
          fetch-depth: 0
      - run: python scripts/patch-payment-edit.py
      - run: |
          git rm scripts/patch-payment-edit.py .github/workflows/apply-payment-edit-pricing.yml
          git diff --check
          git config user.name "tech-stock-bot"
          git config user.email "actions@users.noreply.github.com"
          git add 'src/app/api/sales/[id]/route.ts'
          git commit -m "feat: align sale edits with USD payment coverage"
          git push origin HEAD:feature/payment-pricing-cotizador
