name: Validate feature

on:
  pull_request:
    branches:
      - master
  push:
    branches:
      - feature/payment-pricing-cotizador
      - agent/customer-orders-on-demand

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: validation
          POSTGRES_PASSWORD: validation
          POSTGRES_DB: validation
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U validation -d validation"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://validation:validation@localhost:5432/validation
      NEXTAUTH_SECRET: validation-only
      NEXTAUTH_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx prisma validate
      - run: npx prisma generate
      - run: npx prisma migrate deploy
      - run: node scripts/run-ts-script.cjs scripts/verify-customer-orders.ts
      - run: npx tsc --noEmit
      - run: npm run lint
      - run: npm run build
